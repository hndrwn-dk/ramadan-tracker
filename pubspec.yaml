name: ramadan_tracker
description: Premium Ramadan tracker & planner with yearly seasons, Autopilot Qur'an plan, Sahur/Iftar reminders, and local backup/restore.
publish_to: 'none'
version: 1.0.10+26

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State management
  flutter_riverpod: ^2.4.9
  
  # Database
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # UI
  fl_chart: ^0.65.0
  flutter_svg: ^2.0.10+1
  intl: ^0.20.2
  
  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.2
  
  # Location & Prayer Times
  geolocator: ^12.0.0
  adhan: ^2.0.0+1
  flutter_timezone: ^4.1.1
  http: ^1.2.2
  
  # File operations
  share_plus: ^7.2.1
  cross_file: ^0.3.4
  
  # Utilities
  shared_preferences: ^2.2.2
  package_info_plus: ^8.0.0
  uuid: ^4.2.1
  url_launcher: ^6.2.2
  webview_flutter: ^4.4.2
  
  home_widget: ^0.9.2
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  drift_dev: ^2.14.1
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

dependency_overrides:
  flutter_local_notifications:
    path: plugins/flutter_local_notifications

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon_full_1024.png"
  adaptive_icon_background: "assets/icon/adaptive_background.png"
  adaptive_icon_foreground: "assets/icon/adaptive_foreground.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/icon/adaptive_monochrome.png"
  min_sdk_android: 24

flutter_native_splash:
  color: "#F7F1E3"
  image: assets/icon/splash_logo.png
  color_dark: "#264653"
  image_dark: assets/icon/splash_logo.png
  android_12:
    color: "#F7F1E3"
    image: assets/icon/adaptive_foreground.png
    color_dark: "#264653"
    image_dark: assets/icon/adaptive_foreground.png
  android: true
  ios: false
  web: false
  fullscreen: false

